<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" font-family="Inter, system-ui, sans-serif">
  <!-- Background -->
  <rect width="800" height="900" fill="#FAFAFA"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a1a">Graph 4: Claude.md Skill</text>
  <text x="400" y="65" text-anchor="middle" font-size="14" fill="#666">v2.0 Packaged as an Invokable Skill</text>

  <!-- Era Badge -->
  <rect x="300" y="80" width="200" height="28" rx="14" fill="#8B5CF6"/>
  <text x="400" y="99" text-anchor="middle" font-size="12" font-weight="600" fill="white">🔮 Skill Architecture</text>

  <!-- User -->
  <circle cx="400" cy="160" r="35" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <text x="400" y="155" text-anchor="middle" font-size="20">👤</text>
  <text x="400" y="175" text-anchor="middle" font-size="9" fill="#1E40AF">User</text>

  <!-- Arrow -->
  <path d="M400 195 L400 225" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow4)"/>

  <!-- Claude Interface -->
  <rect x="200" y="235" width="400" height="70" rx="12" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/>
  <text x="400" y="265" text-anchor="middle" font-size="16" font-weight="600" fill="#5B21B6">Claude Desktop / API</text>
  <text x="400" y="288" text-anchor="middle" font-size="11" fill="#7C3AED">"Monitor Iranian media for nuclear narratives"</text>

  <!-- Arrow -->
  <path d="M400 305 L400 335" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <text x="420" y="325" font-size="10" fill="#8B5CF6">invokes</text>

  <!-- SKILL.md Box -->
  <rect x="150" y="345" width="500" height="480" rx="16" fill="white" stroke="#8B5CF6" stroke-width="3"/>

  <!-- Skill Header -->
  <rect x="150" y="345" width="500" height="50" rx="16" fill="#8B5CF6"/>
  <text x="180" y="377" font-size="14" font-weight="700" fill="white">📄 SKILL.md</text>
  <text x="620" y="377" text-anchor="end" font-size="11" fill="#DDD6FE">/skills/media-monitor/</text>

  <!-- Skill Metadata -->
  <rect x="170" y="410" width="460" height="70" rx="8" fill="#F5F3FF"/>
  <text x="190" y="432" font-size="11" font-weight="600" fill="#5B21B6">Metadata</text>
  <text x="190" y="452" font-size="10" fill="#6B7280">name: "media-intelligence"</text>
  <text x="190" y="467" font-size="10" fill="#6B7280">trigger: "monitor media", "news analysis", "coverage report"</text>

  <!-- Skill Prompts -->
  <rect x="170" y="490" width="460" height="90" rx="8" fill="#FEF3C7"/>
  <text x="190" y="512" font-size="11" font-weight="600" fill="#92400E">Unified Prompts</text>
  <text x="190" y="532" font-size="10" fill="#6B7280">@P1-Translate_Topic → Persian query generation</text>
  <text x="190" y="547" font-size="10" fill="#6B7280">@P2-Analyze_Coverage → Intelligence briefing</text>
  <text x="190" y="562" font-size="10" fill="#6B7280">@P3-Evaluate_Quality → Citation scoring</text>

  <!-- Skill Agents -->
  <rect x="170" y="590" width="460" height="100" rx="8" fill="#DBEAFE"/>
  <text x="190" y="612" font-size="11" font-weight="600" fill="#1E40AF">Layered Agents</text>

  <rect x="190" y="625" width="85" height="55" rx="6" fill="white" stroke="#3B82F6"/>
  <text x="232" y="645" text-anchor="middle" font-size="8" font-weight="600" fill="#1E40AF">Translator</text>
  <text x="232" y="660" text-anchor="middle" font-size="7" fill="#6B7280">Gemini</text>

  <rect x="285" y="625" width="85" height="55" rx="6" fill="white" stroke="#3B82F6"/>
  <text x="327" y="645" text-anchor="middle" font-size="8" font-weight="600" fill="#1E40AF">Searcher</text>
  <text x="327" y="660" text-anchor="middle" font-size="7" fill="#6B7280">Exa AI</text>

  <rect x="380" y="625" width="85" height="55" rx="6" fill="white" stroke="#3B82F6"/>
  <text x="422" y="645" text-anchor="middle" font-size="8" font-weight="600" fill="#1E40AF">Analyzer</text>
  <text x="422" y="660" text-anchor="middle" font-size="7" fill="#6B7280">Gemini</text>

  <rect x="475" y="625" width="85" height="55" rx="6" fill="white" stroke="#3B82F6"/>
  <text x="517" y="645" text-anchor="middle" font-size="8" font-weight="600" fill="#1E40AF">Evaluator</text>
  <text x="517" y="660" text-anchor="middle" font-size="7" fill="#6B7280">Gemini</text>

  <!-- Skill Tools/MCP -->
  <rect x="170" y="700" width="460" height="55" rx="8" fill="#ECFDF5"/>
  <text x="190" y="722" font-size="11" font-weight="600" fill="#065F46">MCP Connections</text>
  <text x="190" y="742" font-size="10" fill="#6B7280">Exa Search API • Firebase/Firestore • Gemini API</text>

  <!-- Skill Evaluation -->
  <rect x="170" y="765" width="460" height="45" rx="8" fill="#FEE2E2"/>
  <text x="190" y="787" font-size="11" font-weight="600" fill="#991B1B">Evaluation Metrics</text>
  <text x="190" y="802" font-size="10" fill="#6B7280">Citation Score (1-5) • Faithfulness Score (1-5) • Coverage Confidence</text>

  <!-- Output Arrow -->
  <path d="M400 825 L400 855" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <!-- Output -->
  <rect x="225" y="860" width="350" height="35" rx="17" fill="#10B981" stroke="#059669" stroke-width="2"/>
  <text x="400" y="883" text-anchor="middle" font-size="12" font-weight="600" fill="white">📊 Structured Intelligence Report</text>

  <!-- Benefits Box -->
  <rect x="660" y="410" width="120" height="140" rx="8" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1"/>
  <text x="720" y="435" text-anchor="middle" font-size="11" font-weight="600" fill="#5B21B6">Benefits</text>
  <text x="720" y="460" text-anchor="middle" font-size="9" fill="#6B7280">✅ Reusable</text>
  <text x="720" y="480" text-anchor="middle" font-size="9" fill="#6B7280">✅ Documented</text>
  <text x="720" y="500" text-anchor="middle" font-size="9" fill="#6B7280">✅ Versioned</text>
  <text x="720" y="520" text-anchor="middle" font-size="9" fill="#6B7280">✅ Shareable</text>
  <text x="720" y="540" text-anchor="middle" font-size="9" fill="#6B7280">✅ Composable</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow4" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94A3B8"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8B5CF6"/>
    </marker>
  </defs>
</svg>