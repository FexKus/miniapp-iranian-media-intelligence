<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" font-family="Inter, system-ui, sans-serif">
  <!-- Background -->
  <rect width="800" height="900" fill="#FAFAFA"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a1a">Current Architecture</text>
  <text x="400" y="65" text-anchor="middle" font-size="14" fill="#666">Sequential Pipeline</text>

  <!-- User Trigger -->
  <rect x="250" y="90" width="300" height="50" rx="25" fill="#3B82F6" stroke="#2563EB" stroke-width="2"/>
  <text x="400" y="122" text-anchor="middle" font-size="14" font-weight="600" fill="white">👤 User: "Run Monitoring"</text>

  <!-- Arrow 1 -->
  <path d="M400 140 L400 170" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 1: Translate -->
  <rect x="200" y="180" width="400" height="80" rx="12" fill="white" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="200" y="180" width="400" height="30" rx="12" fill="#F1F5F9"/>
  <text x="220" y="200" font-size="11" font-weight="600" fill="#64748B">STEP 1</text>
  <text x="400" y="225" text-anchor="middle" font-size="16" font-weight="600" fill="#1a1a1a">@Persian_Translator</text>
  <text x="400" y="248" text-anchor="middle" font-size="12" fill="#666">Gemini 2.0 Flash → Persian search query</text>

  <!-- Arrow 2 -->
  <path d="M400 260 L400 290" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: Search (with warning) -->
  <rect x="200" y="300" width="400" height="100" rx="12" fill="white" stroke="#F59E0B" stroke-width="2"/>
  <rect x="200" y="300" width="400" height="30" rx="12" fill="#FEF3C7"/>
  <text x="220" y="320" font-size="11" font-weight="600" fill="#92400E">STEP 2 ⚠️ BOTTLENECK</text>
  <text x="400" y="350" text-anchor="middle" font-size="16" font-weight="600" fill="#1a1a1a">@Article_Searcher</text>
  <text x="400" y="373" text-anchor="middle" font-size="12" fill="#666">Exa AI — Single API call</text>
  <text x="400" y="393" text-anchor="middle" font-size="11" fill="#DC2626">Max 50 domains • Max 20 articles • Sequential</text>

  <!-- Arrow 3 -->
  <path d="M400 400 L400 430" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: Validate -->
  <rect x="200" y="440" width="400" height="80" rx="12" fill="white" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="200" y="440" width="400" height="30" rx="12" fill="#F1F5F9"/>
  <text x="220" y="460" font-size="11" font-weight="600" fill="#64748B">STEP 3</text>
  <text x="400" y="485" text-anchor="middle" font-size="16" font-weight="600" fill="#1a1a1a">@Quality_Validator</text>
  <text x="400" y="508" text-anchor="middle" font-size="12" fill="#666">Filter junk • Tag evidence quality • Dedupe</text>

  <!-- Arrow 4 -->
  <path d="M400 520 L400 550" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4: Analyze -->
  <rect x="200" y="560" width="400" height="80" rx="12" fill="white" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="200" y="560" width="400" height="30" rx="12" fill="#F1F5F9"/>
  <text x="220" y="580" font-size="11" font-weight="600" fill="#64748B">STEP 4</text>
  <text x="400" y="605" text-anchor="middle" font-size="16" font-weight="600" fill="#1a1a1a">@Intelligence_Analyst</text>
  <text x="400" y="628" text-anchor="middle" font-size="12" fill="#666">Gemini → Citation-enforced briefing</text>

  <!-- Arrow 5 -->
  <path d="M400 640 L400 670" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 5: Evaluate -->
  <rect x="200" y="680" width="400" height="80" rx="12" fill="white" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="200" y="680" width="400" height="30" rx="12" fill="#F1F5F9"/>
  <text x="220" y="700" font-size="11" font-weight="600" fill="#64748B">STEP 5</text>
  <text x="400" y="725" text-anchor="middle" font-size="16" font-weight="600" fill="#1a1a1a">@Evaluator_Agent</text>
  <text x="400" y="748" text-anchor="middle" font-size="12" fill="#666">Citation score • Faithfulness score • Issues</text>

  <!-- Arrow 6 -->
  <path d="M400 760 L400 790" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Output -->
  <rect x="250" y="800" width="300" height="50" rx="25" fill="#10B981" stroke="#059669" stroke-width="2"/>
  <text x="400" y="832" text-anchor="middle" font-size="14" font-weight="600" fill="white">📊 Dashboard (Real-time)</text>

  <!-- Stats Box -->
  <rect x="620" y="300" width="150" height="100" rx="8" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <text x="695" y="325" text-anchor="middle" font-size="12" font-weight="600" fill="#DC2626">Limitations</text>
  <text x="695" y="350" text-anchor="middle" font-size="11" fill="#7F1D1D">20 articles max</text>
  <text x="695" y="370" text-anchor="middle" font-size="11" fill="#7F1D1D">~15s search time</text>
  <text x="695" y="390" text-anchor="middle" font-size="11" fill="#7F1D1D">Sequential only</text>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94A3B8"/>
    </marker>
  </defs>
</svg>